[package]
name = "abu_hanifah_parameters"
version = "0.1.0"
edition = "2021"
authors = ["Abu Hanifah AI <security@abuhanifah.ai>"]
description = "High-performance Web Parameter Discovery & Dalfox Formatter for Bug Bounty (HackerOne)"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
scraper = "0.18"
url = "2.5"
colored = "2.1"
futures = "0.3"
